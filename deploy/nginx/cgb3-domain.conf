server {
    server_name cgb3patriki.ru www.cgb3patriki.ru;
    root /var/www/cgb-no-3-patriki-site/public;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location ~ /\. { deny all; }

    location = / { rewrite ^ /index.html break; }
    location = /index.html { return 301 /$is_args$args; }
    location = /composition { return 301 /team$is_args$args; }
    location = /composition.html { return 301 /team$is_args$args; }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8787/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
        client_max_body_size 25m;
    }

    location ^~ /media/ {
        alias /var/lib/cgb-storage/;
        types { image/jpeg jpg jpeg; image/png png; image/webp webp; image/gif gif; }
        default_type application/octet-stream;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; frame-ancestors 'self'" always;
        access_log off;
    }

    location ~ ^/js/core/(async-state|auth|roles-engine|config|supabase-loader|database-config|database-loader|database-client)\.js$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }

    location ^~ /ustav/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        access_log off;
    }

    location = /logo.png { try_files /images/brand/logo.png =404; }
    location = /logo.svg { try_files /images/brand/logo.svg =404; }
    location = /fon.png { try_files /images/brand/fon.png =404; }

    location = /tests {
        try_files /tests.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }

    location ~ ^/(.+)\.html$ { return 301 /$1$is_args$args; }
    location / { try_files $uri $uri/ $uri.html =404; }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/cgb3patriki.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cgb3patriki.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name cgb3patriki.ru www.cgb3patriki.ru;
    return 301 https://$host$request_uri;
}
